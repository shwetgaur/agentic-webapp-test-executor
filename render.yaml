services:
  - type: web
    name: agentic-webapp-test-executor
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: HEADLESS
        value: "true"
      - key: NOTIFY_ENABLED
        value: "true"
      - key: NOTIFY_CHANNEL
        value: console
      - key: GROQ_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
